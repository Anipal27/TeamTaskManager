<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup • TeamFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border: none; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container"><a class="navbar-brand fw-bold" href="index.html">TeamFlow</a></div>
    </nav>

    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card p-5" style="width: 420px; border-radius: 16px;">
            <h2 class="text-center mb-4 fw-bold">Create Account</h2>

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control form-control-lg">
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control form-control-lg">
            </div>
            <div class="mb-4">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-control form-control-lg">
            </div>

            <div class="mb-4">
                <label class="form-label">Role</label>
                <select id="role" class="form-select form-select-lg">
                    <option value="MEMBER">Team Member</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <button class="btn btn-success btn-lg w-100" onclick="signup()">Create Account</button>

            <p class="text-center mt-4">
                Already have an account? <a href="/login.html" class="text-decoration-none">Login</a>
            </p>
        </div>
    </div>

    <script src="/js/script.js"></script>
</body>
</html>
